name: Update Classroom Data

on:
  schedule:
    # Daily at 13:00 UTC (6 AM PT). A full run takes under a minute and only
    # commits when the registrar or UCLA Community data actually changed.
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      term:
        description: 'Term code like 26F (blank = auto)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-classrooms
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape class schedules
        run: python scrape.py ${{ inputs.term && format('--term {0}', inputs.term) || '' }}

      - name: Scrape club / org events
        # Best effort: a UCLA Community outage should not block class data.
        continue-on-error: true
        run: python scrape_events.py ${{ inputs.term && format('--term {0}', inputs.term) || '' }}

      - name: Commit if changed
        run: |
          if git diff --quiet -- classrooms.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classrooms.json
          git commit -m "chore: update classroom data ($(date -u +%Y-%m-%d))"
          git push
